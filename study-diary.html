<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anjie — Study Diary</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-nav">
    <a class="site-nav__brand" href="index.html">Anjie</a>
    <button type="button" class="site-nav__toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    <nav aria-label="Primary">
      <ul class="site-nav__links">
        <li><a href="about.html">About</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="study-diary.html" aria-current="page">Study Diary</a></li>
        <li><a href="share-life.html">Share Life</a></li>
        <li><a href="toolkit.html">Toolkit</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="diary container">
      <div class="diary-cover">
        <p class="diary-cover__label">STUDY DIARY / 2026</p>
        <h1 class="diary-cover__title">Study<br />Diary.</h1>
        <button type="button" class="diary-cover__open" aria-label="Open diary">›</button>
      </div>

      <div class="diary-book">
        <button type="button" class="diary-nav diary-nav--prev" aria-label="Previous page">‹</button>
        <div class="diary-stage"></div>
        <button type="button" class="diary-nav diary-nav--next" aria-label="Next page">›</button>
      </div>

      <div class="diary-toolbar">
        <button type="button" class="diary-write-btn">Write Diary</button>
      </div>

      <div class="diary-pagination">
        <div class="diary-pagination__dots"></div>
        <p class="diary-pagination__count"></p>
      </div>
    </section>
  </main>

  <div class="diary-modal-backdrop" hidden>
    <div class="diary-modal">
      <div class="diary-modal__header">
        <h3>Write a Diary Entry</h3>
        <button type="button" class="diary-modal__close" aria-label="Close">×</button>
      </div>
      <form class="diary-form">
        <div class="diary-form__row">
          <label class="diary-form__field">
            <span>Category</span>
            <select name="category">
              <option value="On Arrival">On Arrival</option>
              <option value="On Everyday Life">On Everyday Life</option>
              <option value="On Reflection">On Reflection</option>
              <option value="Travel">Travel</option>
              <option value="Coursework">Coursework</option>
            </select>
          </label>
          <label class="diary-form__field">
            <span>Date</span>
            <input type="text" name="date" placeholder="YYYY.MM.DD" required />
          </label>
        </div>
        <label class="diary-form__field">
          <span>Title</span>
          <input type="text" name="title" placeholder="e.g. Rainy afternoon in the library" required />
        </label>
        <label class="diary-form__field">
          <span>Quote / motto (optional)</span>
          <input type="text" name="quote" placeholder="A line that captures the day" />
        </label>
        <label class="diary-form__field">
          <span>Diary content</span>
          <textarea name="body" rows="6" placeholder="What happened, what you noticed, how it felt." required></textarea>
        </label>
        <label class="diary-form__field">
          <span>Image URL (optional)</span>
          <input type="text" name="image" placeholder="Leave blank to use a placeholder" />
        </label>
        <div class="diary-form__actions">
          <button type="submit" class="button button--primary">Save entry</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Anjie</p>
  </footer>

  <script src="js/nav.js" defer></script>
  <script type="module" src="js/diary.js"></script>
</body>
</html>
