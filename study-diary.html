<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anjie — Study Diary</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <header class="site-nav">
    <a class="site-nav__brand" href="index.html">Anjie</a>
    <button type="button" class="site-nav__toggle" aria-label="Toggle navigation menu" aria-expanded="false">☰</button>
    <nav aria-label="Primary">
      <ul class="site-nav__links">
        <li><a href="about.html">About</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="study-diary.html" aria-current="page">Study Diary</a></li>
        <li><a href="share-life.html">Share Life</a></li>
        <li><a href="toolkit.html">Toolkit</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="diary container">
      <div class="diary-cover">
        <p class="diary-cover__label">STUDY DIARY / 2026</p>
        <h1 class="diary-cover__title">Study<br />Diary.</h1>
        <button type="button" class="diary-cover__open" aria-label="Open diary">›</button>
      </div>

      <div class="diary-book">
        <button type="button" class="diary-nav diary-nav--prev" aria-label="Previous page">‹</button>
        <div class="diary-stage"></div>
        <button type="button" class="diary-nav diary-nav--next" aria-label="Next page">›</button>
      </div>

      <div class="diary-toolbar">
        <button type="button" class="diary-write-btn" hidden>Write Diary</button>
        <button type="button" class="diary-login-btn">Log In</button>
      </div>

      <div class="diary-pagination">
        <div class="diary-pagination__dots"></div>
        <p class="diary-pagination__count"></p>
      </div>
    </section>
  </main>

  <div class="diary-modal-backdrop" hidden>
    <div class="diary-modal">
      <div class="diary-modal__header">
        <h3>Write a Diary Entry</h3>
        <button type="button" class="diary-modal__close" aria-label="Close">×</button>
      </div>
      <form class="diary-form">
        <div class="diary-form__row">
          <label class="diary-form__field">
            <span>Category</span>
            <select name="category">
              <option value="Study">📖 Study</option>
              <option value="Abroad / Travel">✈️ Abroad / Travel</option>
              <option value="Chill Beach">🏖️ Chill Beach</option>
              <option value="Cozy Coffee Shop">☕ Cozy Coffee Shop</option>
              <option value="Quiet Nature">🌳 Quiet Nature</option>
              <option value="City Sunset">🌆 City Sunset</option>
              <option value="Rainy Reflection">🌧️ Rainy Reflection</option>
              <option value="Midnight Wanderer">🌙 Midnight Wanderer</option>
            </select>
          </label>
          <label class="diary-form__field">
            <span>Date</span>
            <input type="text" name="date" placeholder="YYYY.MM.DD" required />
          </label>
        </div>
        <label class="diary-form__field">
          <span>Title</span>
          <input type="text" name="title" placeholder="e.g. Rainy afternoon in the library" required />
        </label>
        <label class="diary-form__field">
          <span>Quote / mood (optional)</span>
          <input type="text" name="quote" placeholder="A line that captures the day" />
        </label>
        <label class="diary-form__field">
          <span>Diary content</span>
          <textarea name="body" rows="6" placeholder="What happened, what you noticed, how it felt. Leave a blank line between paragraphs." required></textarea>
        </label>

        <div class="diary-form__field">
          <span>Media type</span>
          <div class="diary-form__tabs">
            <button type="button" class="diary-form__tab is-active" data-media-type="image">Image</button>
            <button type="button" class="diary-form__tab" data-media-type="video">Video</button>
          </div>
        </div>

        <div class="diary-form__media-group" data-media-group="image">
          <label class="diary-form__field">
            <span>Image 1 (max 8MB, leave blank to use a placeholder)</span>
            <input type="file" name="image1" accept="image/*" />
          </label>
          <label class="diary-form__field">
            <span>Image 2 (optional)</span>
            <input type="file" name="image2" accept="image/*" />
          </label>
          <label class="diary-form__field">
            <span>Image 3 (optional)</span>
            <input type="file" name="image3" accept="image/*" />
          </label>
          <label class="diary-form__field">
            <span>Image 4 (optional)</span>
            <input type="file" name="image4" accept="image/*" />
          </label>
        </div>

        <div class="diary-form__media-group" data-media-group="video" hidden>
          <label class="diary-form__field">
            <span>Video (max 100MB, leave blank to use a placeholder)</span>
            <input type="file" name="video" accept="video/*" />
          </label>
        </div>

        <label class="diary-form__field">
          <span>Media caption (optional)</span>
          <input type="text" name="caption" placeholder="A short caption for the photo(s) or video" />
        </label>

        <p class="diary-form__error" hidden></p>
        <div class="diary-form__actions">
          <button type="button" class="button diary-form__cancel">Cancel</button>
          <button type="submit" class="button button--primary">Insert to Abroad Diary</button>
        </div>
      </form>
    </div>
  </div>

  <div class="diary-lightbox-backdrop" hidden>
    <button type="button" class="diary-lightbox__close" aria-label="Close">×</button>
    <img class="diary-lightbox__image" src="" alt="" />
  </div>

  <div class="diary-mood-modal-backdrop" hidden>
    <div class="diary-mood-modal">
      <div class="diary-modal__header">
        <h3 class="diary-mood-modal__title">Mood</h3>
        <button type="button" class="diary-mood-modal__close" aria-label="Close">×</button>
      </div>
      <div class="diary-mood-modal__options"></div>
      <button type="button" class="button diary-mood-modal__clear">Clear</button>
    </div>
  </div>

  <div class="diary-login-modal-backdrop" hidden>
    <div class="diary-login-modal">
      <div class="diary-modal__header">
        <h3>Log In</h3>
        <button type="button" class="diary-login-modal__close" aria-label="Close">×</button>
      </div>
      <form class="diary-login-form">
        <label class="diary-form__field">
          <span>Email</span>
          <input type="email" name="email" required />
        </label>
        <label class="diary-form__field">
          <span>Password</span>
          <input type="password" name="password" required />
        </label>
        <p class="diary-form__error" hidden></p>
        <div class="diary-form__actions">
          <button type="button" class="button diary-login-form__cancel">Cancel</button>
          <button type="submit" class="button button--primary">Log In</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Anjie</p>
  </footer>

  <script src="js/nav.js" defer></script>
  <script type="module" src="js/diary.js"></script>
</body>
</html>
